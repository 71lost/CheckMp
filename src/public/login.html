<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checker Raridade</title>

  <style>
    body { 
      background:#013b4d; 
      color:#fff; 
      font-family:Arial,sans-serif; 
      text-align:center; 
      padding:20px; 
      margin:0;
    }

    h1 { color:rgb(147, 188, 196); }

    .box {
      max-width:600px;
      margin:0 auto 20px;
      background:#022b3a;
      padding:20px;
      border-radius:8px;
    }

    input, textarea {
      width:100%;
      padding:10px;
      margin:8px 0;
      border-radius:5px;
      border:none;
      font-size:14px;
    }

    textarea {
      background:#222; 
      color:#0f0; 
      height:120px;
    }

    button {
      padding:10px 20px;
      font-weight:bold;
      border:none;
      border-radius:5px;
      cursor:pointer;
      margin-top:10px;
    }

    .start { background:#0f0; color:#000; }
    .pause { background:#f00; color:#fff; }

    .hidden { display:none; }

    .status span { display:block; margin:4px 0; }

    .result-box {
      background:#222;
      padding:10px;
      border-radius:5px;
      max-height:200px;
      overflow-y:auto;
      text-align:left;
    }
  </style>
</head>
<body>

<h1>Checker Raridade</h1>

<!-- 🔹 ETAPA 1 – DADOS DO PAGADOR -->
<div class="box" id="pagadorBox">
  <h3>Dados do Pagador</h3>

  <input type="text" id="nome" placeholder="Nome completo" required>
  <input type="text" id="cpfCnpj" placeholder="CPF" required>
  <input type="email" id="email" placeholder="Email" required>
  <input type="tel" id="telefone" placeholder="Telefone" required>

  <button class="start" onclick="salvarPagador()">Continuar</button>
</div>

<!-- 🔹 ETAPA 2 – CHECKER (inalterado) -->
<div class="box hidden" id="checkerBox">

  <textarea id="inputData" placeholder="4111111111111111 | 12 | 25 | 123"></textarea>

  <div>
    <button class="start" onclick="startChecker()">INICIAR</button>
    <button class="pause" onclick="pauseChecker()">PAUSAR</button>
  </div>

  <div class="status">
    <span>Status: <strong id="status">Aguardando</strong></span>
    <span>Carregadas: <strong id="loaded">0</strong></span>
    <span>Testadas: <strong id="tested">0</strong></span>
    <span>Aprovadas: <strong id="approved">0</strong></span>
    <span>Reprovadas: <strong id="rejected">0</strong></span>
  </div>

  <div class="result-box" id="approvedBox"></div>
</div>

<script>
  /* =======================
     PAGADOR (NOVA PARTE)
  ======================= */
  function salvarPagador() {
    const pagador = {
      nome: document.getElementById("nome").value,
      cpfCnpj: document.getElementById("cpfCnpj").value,
      email: document.getElementById("email").value,
      telefone: document.getElementById("telefone").value
    };

    if (!pagador.nome || !pagador.cpfCnpj || !pagador.email || !pagador.telefone) {
      alert("Preencha todos os dados do pagador");
      return;
    }

    sessionStorage.setItem("pagador", JSON.stringify(pagador));

    document.getElementById("pagadorBox").classList.add("hidden");
    document.getElementById("checkerBox").classList.remove("hidden");
  }

  /* =======================
     CHECKER (LÓGICA ORIGINAL)
  ======================= */
  let isRunning = false;
  let index = 0;
  let entries = [];
  const approvedList = [];

  function startChecker() {
    if (isRunning) return;
    isRunning = true;

    const pagador = JSON.parse(sessionStorage.getItem("pagador"));
    if (!pagador) {
      alert("Dados do pagador não encontrados");
      return;
    }

    document.getElementById("status").textContent = "Testando...";
    entries = document.getElementById("inputData").value
      .trim()
      .split("\n")
      .filter(l => l.trim());

    document.getElementById("loaded").textContent = entries.length;
    index = 0;
    testNext(pagador);
  }

  function pauseChecker() {
    isRunning = false;
    document.getElementById("status").textContent = "Pausado";
  }

  async function testNext(pagador) {
    if (!isRunning || index >= entries.length) {
      document.getElementById("status").textContent = "Finalizado";
      return;
    }

    const parts = entries[index].split("|").map(x => x.trim());

    try {
      const res = await fetch("/api/cards", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
  // 🔹 Dados do cartão
          card_number: parts[0],              // número do cartão
          expiration_month: parts[1],         // mês
          expiration_year: parts[2],          // ano
          security_code: parts[3],            // CVV

          // 🔹 Titular do cartão
          cardholder: {
            name: pagador.nome
          },

          // 🔹 Dados do pagador
          email: pagador.email,
          cpfCnpj: pagador.cpfCnpj,
          telefone: pagador.telefone,

          // 🔹 Valor
          amount: 1.00,

          // 🔹 Dados extras exigidos pelo Asaas (evita erro)
          creditCardHolderInfo: {
            name: pagador.nome,
            email: pagador.email,
            cpfCnpj: pagador.cpfCnpj,
            phone: pagador.telefone,
            postalCode: "01001000",
            addressNumber: "123"
          }
        })
});

      const result = await res.json();
      document.getElementById("tested").textContent = index + 1;

      if (result.status === "approved" || result.status === "authorized") {
        approvedList.push(entries[index]);
        document.getElementById("approved").textContent = approvedList.length;
        document.getElementById("approvedBox").innerHTML += `<div>✅ ${entries[index]}</div>`;
      } else {
        document.getElementById("rejected").textContent++;
      }

    } catch (e) {
      document.getElementById("rejected").textContent++;
    }

    index++;
    setTimeout(() => testNext(pagador), 800);
  }
</script>

</body>
</html>
